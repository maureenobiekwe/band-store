extends: existence
message: "Numbers must be spelled out"
link: 
level: warning
ignorecase: true
scope: sentence
tokens:
  - '.*[0-9]+\s*(?!(AM|PM))+' #need to match words before to add exceptions
  - '.*[0-9][.]'
exceptions:
  - '[pP]ort [0-9]+'
  - 'WSL2'
  - '[vV]ersions? [0-9]'
  - '[v.]+[0-9]+'
  - '.*\s*\$[0-9]+'
  - 'itemsPerRow'